[shell]
name = "ancient"
description = "Shell para Hyprland inspirado en la interfaz de Dota 2"
version = "0.1.0"
license = "GPL-3.0-or-later"
engine = "quickshell"
start = "qs -c ancient -d"
stop = "qs -c ancient kill"

[packages]
repo = [
  "quickshell",
  "networkmanager", "upower", "pipewire", "bluez", "bluez-utils",   # red, batería, audio, bluetooth
  "grim", "slurp", "wl-clipboard", "wf-recorder", "jq",             # capturas y grabación
  "brightnessctl", "hyprsunset",                                    # brillo y luz nocturna
  "libnotify", "pacman-contrib", "procps-ng",                       # notificaciones, actualizaciones, pgrep
  "foot",                                                           # terminal de "Quick buy"
]
aur = []

[ipc]
bar = "qs -c ancient ipc call bar toggle"
notifs_clear = "qs -c ancient ipc call notifs clear"
shot_screen = "qs -c ancient ipc call capture screen"
shot_region = "qs -c ancient ipc call capture region"
shot_window = "qs -c ancient ipc call capture window"
rec_region  = "qs -c ancient ipc call capture record"
rec_screen  = "qs -c ancient ipc call capture recordScreen"
rec_sound   = "qs -c ancient ipc call capture recordSound"
volume_up   = "qs -c ancient ipc call osd volumeUp"
volume_down = "qs -c ancient ipc call osd volumeDown"
volume_mute = "qs -c ancient ipc call osd mute"
bright_up   = "qs -c ancient ipc call osd brightnessUp"
bright_down = "qs -c ancient ipc call osd brightnessDown"
mode     = "qs -c ancient ipc call mode toggle"
mode_set = "qs -c ancient ipc call mode set <radiant|dire>"
launcher = "qs -c ancient ipc call launcher toggle"
lock    = "qs -c ancient ipc call lock lock"
session = "qs -c ancient ipc call session open"
media_toggle = "qs -c ancient ipc call media toggle"
media_next   = "qs -c ancient ipc call media next"
media_prev   = "qs -c ancient ipc call media previous"
media_stop   = "qs -c ancient ipc call media stop"

[conflicts]
shells = []

[hooks]
install = "hooks/install.sh"
uninstall = "hooks/uninstall.sh"
update = "hooks/update.sh"

[hyprland]
config = "hypr/shell.lua"     # duran la enlaza en ~/.config/hypr/shell.lua
